<!DOCTYPE html>
<html>
<head>
    <title>Available Trains</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h2 class="mb-4">Available Trains</h2>
        <div class="row">
            {% for train in trains %}
            <div class="col-md-4 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">{{ train[1] }}</h5> <!-- train_name -->
                        <p class="card-text">
                            <strong>From:</strong> {{ train[2] }}<br> <!-- source -->
                            <strong>To:</strong> {{ train[3] }}<br> <!-- destination -->
                            <strong>Departure:</strong> {{ train[4] }}<br> <!-- departure_time -->
                            <strong>Arrival:</strong> {{ train[5] }} <!-- arrival_time -->
                        </p>
                        <a href="{{ url_for('book_ticket', train_id=train[0]) }}" class="btn btn-primary">Book Ticket</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
